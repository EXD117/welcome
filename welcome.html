<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能助手 - 欢迎页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .feature {
            padding: 20px 10px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .feature:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .feature-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .feature-title {
            font-size: 0.9rem;
            color: #333;
            font-weight: 600;
        }

        .feature-desc {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
        }

        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            font-weight: 600;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .start-button:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 30px;
            color: #aaa;
            font-size: 0.85rem;
        }

        .chat-container {
            display: none;
            margin-top: 30px;
        }

        .chat-box {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .chat-message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 80%;
        }

        .chat-message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
        }

        .chat-message.assistant {
            background: #e8e8e8;
            color: #333;
            margin-right: auto;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .chat-input button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="avatar">🤖</div>
        
        <h1>欢迎回来！</h1>
        <p class="subtitle">我是你的智能助手，很高兴为你服务<br>有什么我可以帮你的吗？</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🧮</div>
                <div class="feature-title">计算器</div>
                <div class="feature-desc">数学计算</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🌤️</div>
                <div class="feature-title">天气查询</div>
                <div class="feature-desc">实时天气</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📝</div>
                <div class="feature-title">文件操作</div>
                <div class="feature-desc">读写文件</div>
            </div>
        </div>
        
        <button class="start-button" onclick="startChat()">开始对话</button>
        
        <div class="footer">
            <p>智能助手 v1.0</p>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="chat-box" id="chatBox">
                <div class="chat-message assistant">你好！我是智能助手，很高兴为你服务！</div>
            </div>
            <div class="chat-input">
                <input type="text" id="userInput" placeholder="输入你的问题..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        function startChat() {
            document.querySelector('.features').style.display = 'none';
            document.querySelector('.start-button').style.display = 'none';
            document.querySelector('.subtitle').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'block';
            document.getElementById('userInput').focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const chatBox = document.getElementById('chatBox');
            
            chatBox.innerHTML += `<div class="chat-message user">${message}</div>`;
            
            input.value = '';
            
            chatBox.scrollTop = chatBox.scrollHeight;
            
            setTimeout(() => {
                const responses = [
                    `你说: ${message}\n\n我是智能助手，很高兴为你服务！\n\n可用工具:\n- calculator: 用于进行数学计算，支持加减乘除运算\n- weather: 用于查询指定城市的天气情况\n- file: 用于读写文件内容`,
                    `我收到了你的消息: "${message}"\n\n请问你需要使用计算器、查询天气还是操作文件？`,
                    `感谢你的提问！\n\n你可以让我帮你进行计算、查询天气或者读写文件。`
                ];
                
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                chatBox.innerHTML += `<div class="chat-message assistant">${randomResponse}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
